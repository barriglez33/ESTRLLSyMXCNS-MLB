name: Update Yankees News RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "31 * * * *"

concurrency:
  group: yankees-news-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Python
        run: |
          python -m py_compile main.py
          python -c "import json; c=json.load(open('config.json',encoding='utf-8')); print('Tracked names:',len(c['people'])); print('Rolling window:',c['settings']['max_age_hours'],'hours')"

      - name: Update Yankees news — rolling 2h batch
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u main.py

      - name: Commit generated RSS and data
        run: |
          git config user.name "Yankees News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Yankees News"
            git push
          fi
