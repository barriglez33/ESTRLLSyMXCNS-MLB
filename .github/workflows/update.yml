name: Update Estrellas MLB RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: estrellas-resto-mlb
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify repository
        run: |
          python -m py_compile main.py
          python - <<'PY'
          import json
          c=json.load(open("config.json",encoding="utf-8"))
          targets=c["players"]+c.get("topics",[])
          print("Players:",len(c["players"]))
          print("Postseason topics:",len(c.get("topics",[])))
          print("Total searches:",len(targets))
          for b in (1,2,3):
              print(f"Batch {b}:",sum(1 for x in targets if x.get("batch")==b))
          print("Rolling window:",c["settings"]["max_age_hours"],"hours")
          PY

      - name: Update Estrellas MLB
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u main.py

      - name: Commit generated RSS and data
        shell: bash
        run: |
          set -e
          git config user.name "Estrellas Resto MLB Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update Estrellas MLB"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt of 5"
            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              wait_seconds=$((attempt * 20))
              echo "GitHub rejected the push. Waiting ${wait_seconds}s before retry..."
              sleep "$wait_seconds"
            fi
          done

          echo "Push failed after 5 attempts."
          exit 1
